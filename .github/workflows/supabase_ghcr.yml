name: Supabase GHCR Image

# Builds a multi-arch (amd64/arm64) debian image and pushes it to
# ghcr.io/supabase/vector on every push to master, tagged with the short commit hash.

permissions:
  contents: read

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every merged commit gets its own image, so queue builds instead of cancelling them.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/supabase/vector

jobs:
  build:
    name: Build ${{ matrix.arch }}
    if: github.repository == 'supabase/vector'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write # Required to push container images to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: bash scripts/ci-free-disk-space.sh

      - uses: ./.github/actions/setup
        with:
          rust: true
          protoc: true

      - name: Build Vector
        env:
          # Thin LTO keeps the build within standard runner memory and time limits.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked

      - name: Stage rootfs
        run: |
          root=dist/image/rootfs
          install -Dm755 target/release/vector "$root/usr/bin/vector"
          install -Dm644 distribution/debian/vector.yaml "$root/etc/vector/vector.yaml"
          install -Dm644 config/vector.yaml "$root/usr/share/vector/examples/vector.yaml"
          mkdir -p "$root/etc/vector/examples" "$root/usr/share/vector/licenses" "$root/var/lib/vector"
          cp -r config/examples/. "$root/etc/vector/examples/"
          cp -r licenses/. "$root/usr/share/vector/licenses/"
          cp NOTICE LICENSE-3rdparty.csv "$root/usr/share/vector/"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/image
          file: distribution/docker/supabase/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p dist/digests
          touch "dist/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: dist/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write # Required to push container images to GHCR
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: dist/digests
          merge-multiple: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create and push manifest
        working-directory: dist/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$IMAGE:${GITHUB_SHA::7}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA::7}"

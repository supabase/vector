sources:
  my_source_id:
    type: http_server
    address: 0.0.0.0:80
    headers:
      - User-Agent
    host_key: hostname
    method: POST
    path: /
    path_key: path
    query_parameters:
      - application
    reject_code: 400
    response_code: 200
    response_source: 'encode_json({ "ids": map_values(.) -> |e| { e.id } })'
    strict_path: true
